openapi: 3.0.3
info:
  title: Document Processing Pipeline
  version: 0.1.0
servers:
  - url: https://api.example.com
security:
  - OidcAuth: []
  - BearerAuth: []
paths:
  /documents:
    post:
      summary: Ingest a document (upload metadata and enqueue intake)
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestRequest'
      responses:
        '202':
          description: Accepted and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
  /documents/{documentId}:
    get:
      summary: Get document status and lifecycle data
      x-roles: [viewer, validator, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatus'
  /documents/{documentId}/classification/confirm:
    post:
      summary: Confirm or override an ambiguous classification
      x-roles: [validator, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationDecision'
      responses:
        '200':
          description: Classification updated and queued for extraction
  /documents/{documentId}/corrections:
    get:
      summary: List validator corrections for a document
      x-roles: [validator, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Corrections with provenance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionLog'
  /learning/corrections/summary:
    get:
      summary: Aggregate corrections by document type and field
      x-roles: [operator, admin]
      parameters:
        - in: query
          name: documentType
          schema:
            type: string
        - in: query
          name: fieldPath
          schema:
            type: string
      responses:
        '200':
          description: Aggregated correction metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionAggregate'
  /learning/retrain:
    post:
      summary: Manually trigger a retraining job using logged corrections
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrainTriggerRequest'
      responses:
        '202':
          description: Retraining triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrainTriggerResponse'
  /templates:
    post:
      summary: Create a template definition
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /templates/{templateId}/versions:
    post:
      summary: Create a versioned template with coordinates and mappings
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateVersionCreateRequest'
      responses:
        '201':
          description: Version created (draft)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
  /templates/{templateId}/versions/{versionId}/deploy:
    post:
      summary: Deploy or rollback a template version
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [promote, rollback]
                targetSlot:
                  type: string
                  enum: [live, canary]
      responses:
        '200':
          description: Deployment updated
  /validation/{documentId}/lock:
    post:
      summary: Acquire a validation lock for keyboard-first review
      x-roles: [validator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 30
              required: [ttlSeconds]
      responses:
        '200':
          description: Lock granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
        '409':
          description: Lock held by another validator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lock'
    delete:
      summary: Release a validation lock
      x-roles: [validator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Released
  /validation/{documentId}/submit:
    post:
      summary: Submit validation results and corrections
      x-roles: [validator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationSubmission'
      responses:
        '200':
          description: Submitted, triggers re-validation/post-enrichment
  /queues/status:
    get:
      summary: Inspect pipeline queue health (for ops/alerting)
      x-roles: [operator, admin]
      responses:
        '200':
          description: Queue metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
  /queues/{queueName}/dlq:
    get:
      summary: Inspect DLQ items for a queue
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/QueueName'
      responses:
        '200':
          description: DLQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DlqItem'
    post:
      summary: Requeue a DLQ item by jobId
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/QueueName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
              required: [jobId]
      responses:
        '202':
          description: Requeued
    delete:
      summary: Purge DLQ for a queue
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/QueueName'
      responses:
        '204':
          description: Purged
  /intake/sources:
    get:
      summary: List intake sources (upload + watched storage)
      x-roles: [operator, admin]
      responses:
        '200':
          description: Intake sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntakeSource'
    post:
      summary: Register an intake source
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeSourceCreateRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSource'
  /intake/sources/{sourceId}:
    patch:
      summary: Update an intake source
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeSourceUpdateRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSource'
    delete:
      summary: Disable an intake source
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: Disabled
  /documents/search:
    get:
      summary: Search documents by metadata/content/status
      x-roles: [viewer, validator, operator, admin]
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: submitter
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStatus'
  /documents/{documentId}/audit:
    get:
      summary: Get audit history for a document
      x-roles: [viewer, validator, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
  /documents/{documentId}/export:
    get:
      summary: Get export job status for a document
      x-roles: [viewer, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
  /exports/{exportJobId}:
    get:
      summary: Inspect an export job
      x-roles: [viewer, operator, admin]
      parameters:
        - $ref: '#/components/parameters/ExportJobId'
      responses:
        '200':
          description: Export job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
  /exports/{exportJobId}/payload:
    get:
      summary: Retrieve export payload
      x-roles: [viewer, operator, admin]
      parameters:
        - $ref: '#/components/parameters/ExportJobId'
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPayload'
  /exports/{exportJobId}/resend:
    post:
      summary: Resend export payload to downstream target
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/ExportJobId'
      responses:
        '202':
          description: Resend initiated
  /review/queue:
    get:
      summary: List pending review items (routed by risk/content)
      x-roles: [validator, operator, admin]
      parameters:
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewQueueItem'
  /review/{documentId}:
    get:
      summary: Fetch review payload (extracted + supplemental data)
      x-roles: [validator, operator, admin]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Review payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPayload'
  /classification/ambiguous:
    get:
      summary: List documents awaiting classification confirmation
      x-roles: [validator, operator, admin]
      responses:
        '200':
          description: Ambiguous classification queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStatus'
  /processing-profiles:
    get:
      summary: List processing profiles
      x-roles: [operator, admin]
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingProfile'
    post:
      summary: Create a processing profile
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingProfileCreateRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingProfile'
  /processing-profiles/{profileId}:
    patch:
      summary: Update a processing profile
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingProfile'
  /rule-versions/extraction:
    post:
      summary: Create extraction rule version
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleVersionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
    get:
      summary: List extraction rule versions
      x-roles: [operator, admin]
      responses:
        '200':
          description: Rule versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleVersion'
  /rule-versions/extraction/{versionId}/deploy:
    post:
      summary: Promote or rollback an extraction rule version
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleDeploymentRequest'
      responses:
        '200':
          description: Deployment updated
  /rule-versions/validation:
    post:
      summary: Create validation rule version
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleVersionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersion'
    get:
      summary: List validation rule versions
      x-roles: [operator, admin]
      responses:
        '200':
          description: Rule versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleVersion'
  /rule-versions/validation/{versionId}/deploy:
    post:
      summary: Promote or rollback a validation rule version
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleDeploymentRequest'
      responses:
        '200':
          description: Deployment updated
  /webhooks/subscriptions:
    get:
      summary: List webhook subscriptions
      x-roles: [operator, admin]
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
    post:
      summary: Create a webhook subscription
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
  /webhooks/subscriptions/{subscriptionId}:
    patch:
      summary: Update a webhook subscription
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
    delete:
      summary: Delete a webhook subscription
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '204':
          description: Deleted
  /webhooks/subscriptions/{subscriptionId}/deliveries:
    get:
      summary: List delivery attempts for a subscription
      x-roles: [operator, admin]
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Delivery attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDelivery'
  /webhooks/test:
    post:
      summary: Send a test webhook for a subscription
      x-roles: [operator, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionId:
                  type: string
              required: [subscriptionId]
      responses:
        '200':
          description: Test sent
  /auth/login:
    post:
      summary: Username/password login (fallback to SSO)
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'

components:
  securitySchemes:
    OidcAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PasswordAuth:
      type: http
      scheme: basic
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportJobId:
      name: exportJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueueName:
      name: queueName
      in: path
      required: true
      schema:
        type: string

  schemas:
    DocumentIngestRequest:
      type: object
      properties:
        sourceChannel:
          type: string
          enum: [upload, watched_storage]
        originalUri:
          type: string
          format: uri
        filename:
          type: string
        checksum:
          type: string
        idempotencyKey:
          type: string
          description: Client-provided key to avoid duplicate intake
        metadata:
          type: object
          additionalProperties: true
      required: [sourceChannel, originalUri, filename, checksum]
    DocumentIngestResponse:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Uploaded]
      required: [documentId, status]
    DocumentStatus:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        parentDocumentId:
          type: string
          format: uuid
          nullable: true
          description: ID of the original source document if this is a split part
        childDocumentIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: IDs of documents split from this one (if status is Split)
        status:
          type: string
          enum:
            - Uploaded
            - Classified
            - Split
            - Extracted
            - EnrichedPre
            - Validated
            - PendingReview
            - EnrichedPost
            - Exported
            - Failed
            - Exception
        stateReason:
          type: string
          description: Human-readable reason for current state or failure
        classification:
          $ref: '#/components/schemas/Classification'
        templateVersionId:
          type: string
          format: uuid
          nullable: true
        ruleVersions:
          type: object
          properties:
            extractionRuleVersionId:
              type: string
              format: uuid
            validationRuleVersionId:
              type: string
              format: uuid
        validationIssues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        externalStatus:
          type: object
          properties:
            system:
              type: string
            status:
              type: string
            message:
              type: string
          description: Latest status from required external enrichment/validation systems
        webhookStates:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
      required: [documentId, status]
    Classification:
      type: object
      properties:
        type:
          type: string
        confidence:
          type: number
          format: float
        ambiguousCandidates:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              confidence:
                type: number
      required: [type, confidence]
    ClassificationDecision:
      type: object
      properties:
        chosenType:
          type: string
        reason:
          type: string
      required: [chosenType]
    TemplateCreateRequest:
      type: object
      properties:
        name:
          type: string
        documentType:
          type: string
        description:
          type: string
          nullable: true
      required: [name, documentType]
    TemplateVersionCreateRequest:
      type: object
      properties:
        version:
          type: string
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'
        tolerances:
          type: object
          properties:
            shiftPx:
              type: integer
            rotationDeg:
              type: number
        matchPolicy:
          $ref: '#/components/schemas/TemplateMatchPolicy'
        fallbackExtractionEnabled:
          type: boolean
          description: Allow flexible extraction when match confidence is low
        outputSchemaVersion:
          type: string
      required: [version, coordinates, outputSchemaVersion]
    TemplateField:
      type: object
      properties:
        fieldId:
          type: string
        page:
          type: integer
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        type:
          type: string
          enum: [kv, table, mark, signature]
        mappingPath:
          type: string
        tableConfig:
          $ref: '#/components/schemas/TableFieldConfig'
        categorizationConfig:
          type: object
          properties:
            enabled:
              type: boolean
            categories:
              type: array
              items:
                type: string
            modelTier:
              type: string
              enum: [gpt-4o-mini, llama-3-8b]
          description: Configuration for LLM-based field categorization
        confidenceThreshold:
          type: number
          format: float
          description: Minimum confidence before routing to exception/review
      required: [fieldId, page, bbox, type, mappingPath]
    TableFieldConfig:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        headerRows:
          type: integer
          minimum: 0
        allowMultipage:
          type: boolean
        mergeTolerancePx:
          type: integer
      description: Structure for table extraction including multi-page handling
    TemplateMatchPolicy:
      type: object
      properties:
        minConfidence:
          type: number
          format: float
        maxShiftPx:
          type: integer
        maxRotationDeg:
          type: number
        partialMatchAction:
          type: string
          enum: [fallback_extraction, route_exception, require_confirmation]
      description: Template match thresholds and fallback handling
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        documentType:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, documentType]
    TemplateVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [draft, live, retired]
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'
        tolerances:
          type: object
          properties:
            shiftPx:
              type: integer
            rotationDeg:
